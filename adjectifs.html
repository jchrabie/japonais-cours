<body data-page="glossaire">
  <main>
    <section class="card" id="adjectifs">
      <h2>Glossaire — Adjectifs</h2>
      <p class="small">Recherche par japonais, kana, romaji ou traduction. Les types な / い et le premier cours d’apprentissage sont affichés.</p>
      <div class="controls glossary-controls">
        <label class="visually-hidden" for="adjSearch">Rechercher</label>
        <input id="adjSearch" oninput="filterTable('adjSearch','adjTable')" placeholder="Rechercher un adjectif…" />
        <label for="adjType" class="visually-hidden">Type d’adjectif</label><select id="adjType" onchange="filterTable('adjSearch','adjTable','adjType')"><option value="">Tous les types</option><option value="い">Adjectifs en い</option><option value="な">Adjectifs en な</option></select>
      </div>
      <div style="overflow-x:auto">
        <table id="adjTable">
          <thead><tr><th>Japonais</th><th>Kana</th><th>Romaji</th><th>Traduction</th><th>Type</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer></footer>
