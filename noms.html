<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/content.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/course-filters.css">
  <title>Glossaire — Noms</title>
  <script src="assets/js/site-config.js" defer></script>
  <script src="assets/js/navigation.js" defer></script>
  <script src="assets/js/vocabulary-data.js" defer></script>
  <script src="assets/js/vocabulary-exclusions.js" defer></script>
  <script src="assets/js/course-catalog.js" defer></script>
  <script src="assets/js/course-picker.js" defer></script>
  <script src="assets/js/glossary.js" defer></script>
</head>
<body data-page="glossaire">
  <main>
    <section class="card" id="noms">
      <h2>Glossaire — Noms</h2>
      <p class="small">Recherche par japonais, kana, romaji ou traduction. Le tableau indique le premier cours où chaque mot a été appris.</p>
      <div class="controls glossary-controls">
        <label class="visually-hidden" for="nounSearch">Rechercher</label>
        <input id="nounSearch" oninput="filterTable('nounSearch','nounTable')" placeholder="Rechercher un nom…" />
      </div>
      <div style="overflow-x:auto">
        <table id="nounTable">
          <thead><tr><th>Japonais</th><th>Kana</th><th>Romaji</th><th>Traduction</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer></footer>
</body>
</html>
